name: CI Spot Checks and Distribution Integrity

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'dist/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOAF_DEV_LINK: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Preserve provenance for the native build and durable render checks.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Node validates emitted JavaScript. TypeScript uses the runner's existing
      # tsc; verify-generated fails explicitly if it is unavailable.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Comprehensive Go/static/adapter tests run locally with verify-local.
      # CI retains only bounded spots plus source-to-distribution integrity.
      - name: Verify spot checks and generated artifacts
        run: make ci-check
