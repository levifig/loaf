name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.2.20'
        required: true
      update_tap:
        description: 'Update levifig/homebrew-tap after uploading assets'
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  # The ceremony guardrail, on the way in: a dev build adds g<short-sha> build
  # metadata, and such a tag never packages a release. Legacy timestamp-patch
  # identities remain recognized while old tags age out.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      dev: ${{ steps.resolve.outputs.dev }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve release ref
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          output="$(go run ./cmd/loafdev classify-tag "$tag")" || exit 1
          echo "$output" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.dev != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    env:
      LOAF_DEV_LINK: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Node 24+ validates emitted JavaScript adapters during the content build.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="$(jq -r .version package.json)"
          expected_tag="v$version"
          if [[ "${{ needs.resolve.outputs.tag }}" != "$expected_tag" ]]; then
            echo "Tag ${{ needs.resolve.outputs.tag }} does not match package version $version." >&2
            exit 1
          fi
          precedence_version="${version%%+*}"
          if [[ "$precedence_version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Full verification belongs to make verify-local before tagging. Release
      # automation checks its own delivery boundary, then constructs artifacts.
      - name: Verify release integrity spot checks
        run: make release-smoke

      - name: Build release targets
        shell: bash
        run: |
          export LOAF_BUILD_COMMIT="$(git rev-parse --short=7 HEAD)"
          export LOAF_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/loafdev release

      - name: Package release archives
        run: go run ./cmd/loafdev package

      - name: Verify archive checksums
        working-directory: dist/release
        run: sha256sum --check --strict checksums.txt

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
            actual_tag="$(jq -r .tagName <<<"$release_json")"
            is_draft="$(jq -r .isDraft <<<"$release_json")"
            if [[ "$actual_tag" != "$RELEASE_TAG" ]]; then
              echo "Release lookup returned tag $actual_tag, expected $RELEASE_TAG." >&2
              exit 1
            fi
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published and immutable; refusing to replace its assets." >&2
              exit 1
            fi
          else
            create_args=(--verify-tag --draft --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${create_args[@]}"
          fi

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: gh release edit "$RELEASE_TAG" --prerelease="$RELEASE_PRERELEASE" --draft=false

      - name: Checkout Homebrew tap
        if: ${{ steps.version.outputs.prerelease != 'true' && (github.event_name != 'workflow_dispatch' || inputs.update_tap == 'true') }}
        uses: actions/checkout@v7
        with:
          repository: levifig/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew formula
        if: ${{ steps.version.outputs.prerelease != 'true' && (github.event_name != 'workflow_dispatch' || inputs.update_tap == 'true') }}
        run: |
          go run ./cmd/loafdev homebrew-formula \
            --formula homebrew-tap/Formula/loaf.rb \
            --checksums dist/release/checksums.txt \
            --version "${{ steps.version.outputs.version }}" \
            --repo levifig/loaf

      - name: Commit Homebrew tap update
        if: ${{ steps.version.outputs.prerelease != 'true' && (github.event_name != 'workflow_dispatch' || inputs.update_tap == 'true') }}
        working-directory: homebrew-tap
        shell: bash
        run: |
          if git diff --quiet -- Formula/loaf.rb; then
            echo "Homebrew formula already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/loaf.rb
          git commit -m "chore: update loaf to ${{ steps.version.outputs.version }}"
          git push
