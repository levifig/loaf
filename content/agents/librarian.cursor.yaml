name: librarian
description: >-
  Durable artifact handler for SQLite-backed Loaf state and .agents/ artifacts.
  Use for ordinary capture, housekeeping, or orchestration when the project journal, reports,
  specs or knowledge notes need lifecycle-safe tending. Handoff owns deliberate transfers.
disable-model-invocation: true
is_background: true
tools:
  Read: true
  Edit: true
  Glob: true
  Grep: true
